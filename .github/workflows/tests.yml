name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"

      # the splitter, the lexer and the zip writer
      - name: unit tests
        run: node tests/run-tests.mjs

      # the browser splitter must cut exactly the same ranges as the python one
      - name: parity with the python cli
        run: node tools/parity.mjs tests/samples

      # the real page, driven through jsdom; optional, skipped when unavailable
      - name: ui tests
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          node tests/run-ui-tests.mjs

      # the command line tool on the same samples
      - name: python cli on the samples
        run: |
          mkdir -p /tmp/out
          for f in tests/samples/*.pgn; do
            python3 pgnsplit.py "$f" --outdir /tmp/out --no-verify
          done